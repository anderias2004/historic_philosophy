<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>پنل ریلز | Historic Philosophy</title>
<style>
:root{color-scheme:dark;--gold:#c6a15a;--bg:#090a0d;--panel:#15171c;--muted:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f7f1e5;font-family:Tahoma,Arial,sans-serif}
header{padding:24px 18px;text-align:center;border-bottom:1px solid #3b3020;background:linear-gradient(120deg,#17130d,#090a0d)}
h1{font-size:23px;color:var(--gold);margin:0 0 8px}header p{color:#c9c1b2;margin:0;font-size:13px}
main{max-width:760px;margin:20px auto;padding:0 14px 40px}.panel{background:var(--panel);border:1px solid #34302a;border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;color:var(--gold);font-size:13px;margin:12px 0 7px}
input,textarea{width:100%;border:1px solid #45413a;border-radius:9px;background:#0d0f13;color:#fff;padding:12px;font:inherit;font-size:14px}
textarea{min-height:105px;line-height:1.9;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.scene-head strong{color:var(--gold)}
button{border:0;border-radius:9px;padding:12px 15px;font:inherit;font-weight:bold;cursor:pointer}
.primary{background:var(--gold);color:#17130d;width:100%;margin-top:10px}.secondary{background:#29251e;color:#e8d7b5}.danger{background:#3a2020;color:#ffd8d8;padding:8px 11px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.hint{font-size:12px;color:var(--muted);line-height:1.8}
#status{padding:12px;border-radius:9px;margin-top:12px;display:none;font-size:13px;line-height:1.8}#status.ok{display:block;background:#163322;color:#b9f0c9}#status.err{display:block;background:#3b2020;color:#ffd0d0}
@media(max-width:480px){.row{grid-template-columns:1fr 1fr}h1{font-size:20px}.panel{padding:13px}}
</style></head>
<body>
<header><h1>HISTORIC PHILOSOPHY</h1><p>پنل ساخت و مدیریت ریلز | مشکی و طلایی</p></header>
<main>
<section class="panel">
<h2>اطلاعات اصلی ریلز</h2>
<label>عنوان</label><input id="title" placeholder="مثلاً ژولیوس سزار">
<label>هوک ابتدای ویدیو</label><textarea id="hook" placeholder="جمله‌ای که مخاطب را درگیر می‌کند"></textarea>
<label>آیدی پیج</label><input id="handle" value="@historic_philosophy">
<p class="hint">مدت ویدیو فعلاً ۷۰ ثانیه است. صحنه‌ها از ثانیه ۷ تا ۶۵ نمایش داده می‌شوند.</p>
</section>
<div id="scenes"></div>
<div class="actions"><button class="secondary" id="add">＋ افزودن صحنه</button></div>
<button class="primary" id="save">ذخیره محتوا در پروژه</button>
<div id="status" role="status"></div>
<p class="hint">پس از ذخیره، برای دیدن تغییرات در Remotion Studio صفحه Studio را بازخوانی کن. تصاویر باید از قبل داخل پوشه public قرار گرفته باشند.</p>
</main>
<script>
const $=id=>document.getElementById(id);let scenes=[];
function sceneCard(s,i){return `<section class="panel scene" data-index="${i}">
<div class="scene-head"><strong>صحنه ${i+1}</strong><button class="danger remove" type="button">حذف</button></div>
<div class="row"><div><label>شروع (ثانیه)</label><input class="start" type="number" min="7" max="64" value="${s.start}"></div><div><label>پایان (ثانیه)</label><input class="end" type="number" min="8" max="65" value="${s.end}"></div></div>
<label>متن صحنه</label><textarea class="text" placeholder="متن روایت این صحنه">${escapeHtml(s.text||"")}</textarea>
<label>مسیر تصویر (اختیاری)</label><input class="image" placeholder="images/example.jpg" value="${escapeHtml(s.imageFile||"")}">
<p class="hint">اگر تصویر نداری، این قسمت را خالی بگذار.</p></section>`}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){ $('scenes').innerHTML=scenes.map(sceneCard).join("");document.querySelectorAll(".remove").forEach((b,i)=>b.onclick=()=>{scenes.splice(i,1);render()})}
function collect(){return {title:$('title').value.trim(),hook:$('hook').value.trim(),handle:$('handle').value.trim(),scenes:[...document.querySelectorAll(".scene")].map(el=>({start:Number(el.querySelector(".start").value),end:Number(el.querySelector(".end").value),text:el.querySelector(".text").value.trim(),...(el.querySelector(".image").value.trim()?{imageFile:el.querySelector(".image").value.trim()}: {})}))}}
function status(message,ok){$('status').textContent=message;$('status').className=ok?'ok':'err'}
async function load(){try{const r=await fetch('/api/content');if(!r.ok)throw new Error('خواندن محتوا ناموفق بود');const d=await r.json();$('title').value=d.title||'';$('hook').value=d.hook||'';$('handle').value=d.handle||'@historic_philosophy';scenes=d.scenes||[];render()}catch(e){status(e.message,false)}}
$('add').onclick=()=>{scenes.push({start:7,end:16,text:'',imageFile:''});render()};
$('save').onclick=async()=>{try{const data=collect();const r=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const result=await r.json();if(!r.ok)throw new Error(result.error||'ذخیره انجام نشد');status(result.message,true)}catch(e){status(e.message,false)}};
load();
</script></body></html>
